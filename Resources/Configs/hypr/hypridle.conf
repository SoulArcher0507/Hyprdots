general {
    before_sleep_cmd = /home/corradoenea/.config/hypr/scripts/quickshell/lock/lock_screen.sh
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = /home/corradoenea/.config/hypr/scripts/quickshell/lock/lock_screen.sh
    ignore_inhibit = false
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_inhibit = false
}
