# -----------------------------------------------------
# Key Bindings
# -----------------------------------------------------
# Variables
$mainMod = SUPER
$term = kitty

# Quickshell
bind = $mainMod CTRL, space, exec, qs ipc -p ~/.config/quickshell/launcher call launcher toggle                 # Open Launcher
bind = $mainMod CTRL ALT, space, exec, qs ipc -p ~/.config/quickshell/gamelauncher call gamelauncher toggle     # Open Game Launcher
bind = $mainMod, A, exec, qs ipc -c ~/.config/quickshell/overview call overview toggle                          # Open Workspaces Overview
bind = $mainMod, W, exec, qs ipc call wallpaper toggle                                                          # Open Wallpaper Picker
bind = $mainMod, C, exec, qs ipc call calendar toggle                                                           # Open Calendar Popup
bind = $mainMod CTRL, Q, exec, qs ipc call power toggle                                                         # Power Options
bind = $mainMod, PRINT, exec, $HOME/.config/hypr/scripts/screenshots.sh                                         # Take a Screenshot
bind = $mainMod SHIFT, S, exec, $HOME/.config/hypr/scripts/screenshots.sh                                       # Take a Screenshot
bind = $mainMod, V, exec, qs ipc call cliphist toggle                                                           # Open Clipboard Manager
bind = $mainMod, M, exec, qs ipc call music toggle                                                              # Open Music Popup
bind = $mainMod, O, exec, qs ipc call arch toggle                                                               # Open Arch Tools
bind = $mainMod CTRL, F, exec, qs ipc call focustime toggle                                                      # Open Focus Time Popup
bind = $mainMod CTRL, M, exec, qs ipc call monitor toggle                                                       # Open Monitor Settings
bind = $mainMod SHIFT, B, exec, qs ipc call battery toggle                                                      # Open Battery Popup
bind = $mainMod, N, exec, qs ipc call notifications toggle                                                      # Open Notification Popup
bind = $mainMod SHIFT, N, exec, qs ipc call network toggle                                                      # Open Network Panel
bind = $mainMod CTRL, N, exec, qs ipc call notificationsound toggle                                             # Open Notification Sound Settings
bind = $mainMod SHIFT, V, exec, qs ipc call volume toggle                                                       # Open Volume Settings
bind = $mainMod SHIFT, K, exec, qs ipc call keybindings toggle                                                  # Open Keybindings List

# Applications
bind = $mainMod, RETURN, exec, $term                                                                            # Open Terminal
bind = $mainMod, B, exec, vivaldi                                                                               # Open Browser
bind = $mainMod, E, exec, dolphin --new-window                                                                  # Open Filemanager
bind = $mainMod SHIFT, O, exec, $term -e nvim Sync/Università-Typst                                             # Open University Notes
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/reload.sh                                                # Reload Configuration
bind = $mainMod, space, exec, $HOME/.config/hypr/scripts/gpt.sh                                                 # Open ChatGPT
bind = $mainMod SHIFT, space, exec, $HOME/.config/hypr/scripts/gemini.sh                                        # Open Gemini
bind = $mainMod ALT, space, exec, $HOME/.config/hypr/scripts/notebooklm.sh                                      # Open NotebookLM
bind = $mainMod, S, exec, $term -e btop                                                                         # Open Btop
bind = $mainMod CTRL, S, exec, $term -e nvtop                                                                   # Open Nvtop

# Windows
bind = $mainMod, Q, killactive                                                                                  # Quit Active Window
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill                     # Kill Active Window and All Open Instances
bind = $mainMod, F, fullscreen, 0                                                                               # Set Active Window Fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1                                                                         # Maximize Window
bind = $mainMod, T, togglefloating                                                                              # Toggle Active Windows into Floating Mode
bind = $mainMod, left, movefocus, l                                                                             # Move Focus Left
bind = $mainMod, right, movefocus, r                                                                            # Move Focus Right
bind = $mainMod, up, movefocus, u                                                                               # Move Focus Up
bind = $mainMod, down, movefocus, d                                                                             # Move Focus Down
bindm = $mainMod, mouse:272, movewindow                                                                         # Move Window with Mouse
bindm = $mainMod, mouse:273, resizewindow                                                                       # Resize Window with Mouse
bind = $mainMod SHIFT, right, resizeactive, 100 0                                                               # Increase Window Width to Right
bind = $mainMod SHIFT, left, resizeactive, -100 0                                                               # Increase Window Width to Left
bind = $mainMod SHIFT, down, resizeactive, 0 100                                                                # Increase Window Width to Up
bind = $mainMod SHIFT, up, resizeactive, 0 -100                                                                 # Inrease Window Width to Down
bind = $mainMod, K, layoutmsg, swapsplit                                                                        # Swapsplit

# Workspaces
bind = $mainMod, 1, workspace, 1                                                                                # Open Workspace 1
bind = $mainMod, 2, workspace, 2                                                                                # Open Workspace 2
bind = $mainMod, 3, workspace, 3                                                                                # Open Workspace 3
bind = $mainMod, 4, workspace, 4                                                                                # Open Workspace 4
bind = $mainMod, 5, workspace, 5                                                                                # Open Workspace 5
bind = $mainMod, 6, workspace, 6                                                                                # Open Workspace 6
bind = $mainMod, 7, workspace, 7                                                                                # Open Workspace 7
bind = $mainMod, 8, workspace, 8                                                                                # Open Workspace 8
bind = $mainMod, 9, workspace, 9                                                                                # Open Workspace 9
bind = $mainMod, 0, workspace, 10                                                                               # Open Workspace 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1                                                                    # Move Active Window to Workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                                                    # Move Active Window to Workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                                                    # Move Active Window to Workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                                                    # Move Active Window to Workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                                                    # Move Active Window to Workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                                                    # Move Active Window to Workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                                                    # Move Active Window to Workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                                                    # Move Active Window to Workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                                                    # Move Active Window to Workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10                                                                   # Move Active Wwindow to Workspace 10

bind = $mainMod, Tab, workspace, m+1                                                                            # Open Next Workspace
bind = $mainMod SHIFT, Tab, workspace, m-1                                                                      # Open Previous Workspace

bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/moveTo.sh 1                                               # Move All Windows to Workspace 1
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/moveTo.sh 2                                               # Move All Windows to Workspace 2
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/moveTo.sh 3                                               # Move All Windows to Workspace 3
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/moveTo.sh 4                                               # Move All Windows to Workspace 4
bind = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/moveTo.sh 5                                               # Move All Windows to Workspace 5
bind = $mainMod CTRL, 6, exec, ~/.config/hypr/scripts/moveTo.sh 6                                               # Move All Windows to Workspace 6
bind = $mainMod CTRL, 7, exec, ~/.config/hypr/scripts/moveTo.sh 7                                               # Move All Windows to Workspace 7
bind = $mainMod CTRL, 8, exec, ~/.config/hypr/scripts/moveTo.sh 8                                               # Move All Windows to Workspace 8
bind = $mainMod CTRL, 9, exec, ~/.config/hypr/scripts/moveTo.sh 9                                               # Move All Windows to Workspace 9
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/moveTo.sh 10                                              # Move All Windows to Workspace 10

bind = , XF86MonBrightnessUp, exec, bash ~/.config/hypr/scripts/quickshell/brightness/brightness_control.sh inc 10
bind = , XF86MonBrightnessDown, exec, bash ~/.config/hypr/scripts/quickshell/brightness/brightness_control.sh dec 10
bind = , XF86AudioRaiseVolume, exec, bash ~/.config/hypr/scripts/quickshell/volume/audio_control.sh set-volume sink @DEFAULT_SINK@ +5
bind = , XF86AudioLowerVolume, exec, bash ~/.config/hypr/scripts/quickshell/volume/audio_control.sh set-volume sink @DEFAULT_SINK@ -5
bind = , XF86AudioMute, exec, bash ~/.config/hypr/scripts/quickshell/volume/audio_control.sh toggle-mute sink @DEFAULT_SINK@
bind = , XF86AudioPlay, exec, playerctl play-pause                                                                                                           
bind = , XF86AudioPause, exec, playerctl pause                                                                                                               
bind = , XF86AudioNext, exec, playerctl next                                                                                                                 
bind = , XF86AudioPrev, exec, playerctl previous                                                                                                             
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle                                                                               
bind = , XF86Lock, exec, ~/.config/hypr/scripts/quickshell/lock/lock_screen.sh"                                                                                                                            
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-
