# -----------------------------------------------------
# Environment
# -----------------------------------------------------
## NVIDIA https://wiki.hyprland.org/Nvidia/
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = SDL_VIDEODRIVER,wayland
env = WLR_DRM_NO_ATOMIC,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only

## FOR VM and POSSIBLY NVIDIA
env = WLR_NO_HARDWARE_CURSORS,1 
env = WLR_RENDERER_ALLOW_SOFTWARE,1

## Dolphin fix
envd = XDG_MENU_PREFIX,arch-
exec = XDG_MENU_PREFIX=arch- kbuildsycoca6 --noincremental

## xdg-desktop-portal
envd = XDG_CURRENT_DESKTOP,Hyprland
envd = XDG_SESSION_TYPE,wayland
envd = XDG_SESSION_DESKTOP,Hyprland

## Theme
### GTK
env = GTK_THEME,Adwaita:dark
env = GTK_APPLICATION_PREFER_DARK_THEME,1

### Qt
env = QT_QPA_PLATFORMTHEME,qt6ct

### Wayland
envd = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

### Electron / Chromium
env = ELECTRON_FORCE_DARK_MODE,1
env = CHROME_FORCE_DARK_MODE,1
